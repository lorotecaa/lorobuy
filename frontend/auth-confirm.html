<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Confirmando tu cuenta | LoroBuy</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <style>
    @font-face{font-family:Inter;src:url("assets/inter-regular.woff2") format("woff2");font-display:swap}
    @font-face{font-family:Montserrat;src:url("assets/montserrat-bold.woff2") format("woff2");font-weight:700;font-display:swap}
    :root{color-scheme:dark;--bg:#09090d;--panel:#12121a;--line:#2c2d38;--text:#f8f8fb;--muted:#a8a9b6;--neon:#17e6ab;--danger:#ff5470}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#251856 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    main{width:min(100%,520px);padding:38px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(24,24,35,.98),rgba(12,12,18,.98));box-shadow:0 24px 80px rgba(0,0,0,.48);text-align:center}
    .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:28px;color:var(--text);font:700 18px Montserrat,sans-serif;letter-spacing:.03em;text-decoration:none}
    .brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}
    .mark{width:58px;height:58px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(23,230,171,.4);background:rgba(23,230,171,.1);color:var(--neon);font-size:26px;box-shadow:0 0 34px rgba(23,230,171,.12)}
    h1{margin:0 0 12px;font:700 clamp(24px,6vw,34px) Montserrat,sans-serif}
    p{min-height:48px;margin:0;color:var(--muted);font-size:16px;line-height:1.6}
    .actions{margin-top:26px}
    a.button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 24px;border-radius:999px;background:var(--neon);color:#06120f;font:700 14px Montserrat,sans-serif;text-decoration:none}
    main.error .mark{border-color:rgba(255,84,112,.45);background:rgba(255,84,112,.1);color:var(--danger)}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main aria-live="polite">
    <a class="brand" href="/"><img src="assets/logo.png" alt="">LoroBuy</a>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Confirmando tu correo</h1>
    <p>Estamos verificando el enlace y preparando tu cuenta de forma segura.</p>
    <div class="actions" hidden><a class="button" href="/?auth=signin&notice=confirmation-expired">Solicitar otro correo</a></div>
  </main>
  <script>
    const card=document.querySelector('main'),mark=document.querySelector('.mark'),title=document.querySelector('h1'),message=document.querySelector('p'),actions=document.querySelector('.actions');
    const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
    const value=name=>hash.get(name)||query.get(name);
    const fail=text=>{card.classList.add('error');mark.textContent='!';title.textContent='No pudimos confirmar el correo';message.textContent=text;actions.hidden=false};
    const errorCode=value('error_code'),errorDescription=value('error_description'),refreshToken=value('refresh_token');
    history.replaceState({},'',location.pathname);
    if(errorCode||!refreshToken){
      const expired=errorCode==='otp_expired'||/expired|invalid/i.test(errorDescription||'');
      fail(expired?'El enlace venció o ya fue utilizado. Solicita un correo nuevo desde el inicio de sesión.':'El enlace de confirmación no es válido. Solicita un correo nuevo desde el inicio de sesión.');
    }else{
      fetch('/api/auth/confirm',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({refreshToken})})
        .then(async response=>{const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'No fue posible confirmar la cuenta.');return body})
        .then(result=>location.replace(result.isAdmin?'/admin':'/?notice=email-confirmed'))
        .catch(error=>fail(error.message));
    }
  </script>
</body>
</html>
